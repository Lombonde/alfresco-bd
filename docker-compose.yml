# PostgreSQL + dados do repositório (alf_data: contentstore, keystore).
# Arranque: docker network create alfresco-net && docker compose up -d
# Credenciais e paths: ../alfresco-app/.env
services:
  postgres:
    image: postgres:13.1
    container_name: alfresco-postgres
    restart: unless-stopped
    env_file:
      - ../alfresco-app/.env
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alfresco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfresco}
      POSTGRES_DB: ${POSTGRES_DB:-alfresco}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./alf_data:/var/lib/alfresco/alf_data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-5432}:5432"
    networks:
      - alfresco-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfresco -d alfresco"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  alfresco-net:
    name: alfresco-net
    external: true
